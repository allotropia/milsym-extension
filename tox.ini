[tox]
skipsdist = true
envlist = lint, py313

[gh-actions]
python =
    3.13: py313

[testenv]
passenv = PYTHON_VERSION
# pyuno is a system site-package, and cannot be installed with pip
system_site_packages = true
deps =
    pytest
    ruff
setenv =
  LC_ALL=C.UTF-8
ignore_errors = true
# run pytest via system python / site-packages visible
commands =
    python -m pytest

[testenv:lint]
skip_install = true
# same for ruff
commands =
    python -m ruff check source tests
